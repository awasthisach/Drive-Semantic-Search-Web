name: Deploy Cloudflare Embed Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/embed/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-embed-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/embed
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/embed/package-lock.json
      - name: Validate deployment configuration
        run: |
          test -s wrangler.toml
          test -s package-lock.json
          grep -q '^name = "drive-semantic-embed"' wrangler.toml
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Wrangler dry run
        run: npm run check
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm run deploy
