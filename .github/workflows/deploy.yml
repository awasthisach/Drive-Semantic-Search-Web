name: Build and Deploy Drive Semantic Search

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-and-worker"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "No lockfile — npm install"; npm install; fi

      - name: Typecheck
        run: npm run lint

      - name: Placeholder guard
        run: |
          if grep -rn "PLACEHOLDER" src/ --include='*.ts' --include='*.tsx'; then
            echo "PLACEHOLDER token found in src — refusing deploy"
            exit 1
          fi
          test $(wc -c < src/components/SemanticSearch.tsx) -gt 4000
          test $(wc -c < src/components/Dashboard.tsx) -gt 4000
          echo "Placeholder guard passed"

      - name: Security audit (production)
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Build project
        env:
          VITE_EMBED_ENDPOINT: ${{ secrets.VITE_EMBED_ENDPOINT || 'https://drive-semantic-embed.awasthi-sach.workers.dev' }}
        run: npm run build

      - name: Bundle size budget
        run: npm run check:bundle

      - name: Upload artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./dist

  worker-check:
    name: Worker dry run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/embed/package-lock.json
      - name: Install Worker dependencies
        working-directory: workers/embed
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Wrangler dry run
        working-directory: workers/embed
        run: npm run check

  deploy-worker:
    name: Deploy Worker v3 and verify live contract
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [build, worker-check]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/embed
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/embed/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate deployment configuration
        run: |
          test -s wrangler.toml
          test -s package-lock.json
          grep -q '^name = "drive-semantic-embed"' wrangler.toml
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm run deploy
      - name: Verify live Worker configuration and auth gate
        env:
          EMBED_ENDPOINT: ${{ secrets.VITE_EMBED_ENDPOINT || 'https://drive-semantic-embed.awasthi-sach.workers.dev' }}
          FIREBASE_TEST_EMAIL: ${{ secrets.FIREBASE_TEST_EMAIL }}
          FIREBASE_TEST_PASSWORD: ${{ secrets.FIREBASE_TEST_PASSWORD }}
        run: |
          if [ -n "$FIREBASE_TEST_EMAIL" ] && [ -n "$FIREBASE_TEST_PASSWORD" ]; then
            node ../../scripts/verify-live-contract.mjs
          else
            echo "::warning::FIREBASE_TEST_EMAIL/FIREBASE_TEST_PASSWORD are not configured; running the public health/auth-gate contract only. Configure both secrets to enable authenticated embedding verification."
            node ../../scripts/verify-live-contract.mjs --allow-unauthenticated
          fi

  deploy-pages:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [deploy-worker]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  verify-pages:
    name: Verify live Pages application
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [deploy-pages]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages propagation
        env:
          PAGE_URL: ${{ needs.deploy-pages.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "$PAGE_URL" -o page.html; then
              if grep -q "Drive Semantic Search" page.html; then
                echo "Live Pages smoke check passed: $PAGE_URL"
                exit 0
              fi
            fi
            echo "Pages content not ready (attempt $attempt/6); waiting 10s"
            sleep 10
          done
          echo "Live Pages smoke check failed: expected app title not found at $PAGE_URL"
          exit 1
