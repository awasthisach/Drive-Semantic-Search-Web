name: Build and Deploy Drive Semantic Search

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-and-worker"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "No lockfile — npm install"; npm install; fi

      - name: Typecheck
        run: npm run lint

      - name: Placeholder guard
        run: |
          if grep -rn "PLACEHOLDER" src/ --include='*.ts' --include='*.tsx'; then
            echo "PLACEHOLDER token found in src — refusing deploy"
            exit 1
          fi
          test $(wc -c < src/components/SemanticSearch.tsx) -gt 4000
          test $(wc -c < src/components/Dashboard.tsx) -gt 4000
          echo "Placeholder guard passed"

      - name: Security audit (production)
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Build project
        env:
          VITE_EMBED_ENDPOINT: ${{ secrets.VITE_EMBED_ENDPOINT || 'https://drive-semantic-embed.awasthi-sach.workers.dev' }}
        run: npm run build

      - name: Bundle size budget
        run: npm run check:bundle

      - name: Upload artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  worker-check:
    name: Worker dry run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/embed/package-lock.json
      - name: Install Worker dependencies
        working-directory: workers/embed
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Wrangler dry run
        working-directory: workers/embed
        run: npm run check

  deploy-worker:
    name: Deploy Worker v3 and verify live contract
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [build, worker-check]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/embed
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/embed/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate deployment configuration
        run: |
          test -s wrangler.toml
          test -s package-lock.json
          grep -q '^name = "drive-semantic-embed"' wrangler.toml
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm run deploy
      - name: Verify authenticated live embed contract
        # Explicitly run from the repository root; the job default is workers/embed.
        working-directory: .
        env:
          EMBED_ENDPOINT: ${{ secrets.VITE_EMBED_ENDPOINT || 'https://drive-semantic-embed.awasthi-sach.workers.dev' }}
          FIREBASE_TEST_ID_TOKEN: ${{ secrets.FIREBASE_TEST_ID_TOKEN }}
        run: node scripts/verify-live-contract.mjs

  deploy-pages:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [deploy-worker]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
