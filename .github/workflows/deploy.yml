name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "No lockfile — npm install"; npm install; fi

      - name: Typecheck
        run: npm run lint

      - name: Placeholder guard
        run: |
          if grep -rn "PLACEHOLDER" src/ --include='*.ts' --include='*.tsx'; then
            echo "PLACEHOLDER token found in src — refusing deploy"
            exit 1
          fi
          test $(wc -c < src/components/SemanticSearch.tsx) -gt 4000
          test $(wc -c < src/components/Dashboard.tsx) -gt 4000
          echo "Placeholder guard passed"

      - name: Security audit (production)
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Bundle size budget
        run: npm run check:bundle

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
