name = "drive-semantic-embed"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
FIREBASE_PROJECT_ID = "thevvforg"
EMBED_MODEL = "gemini-embedding-2"
EMBED_DIMENSION = "768"
MAX_TEXTS = "32"
MAX_CHARS = "8000"
MAX_BODY_BYTES = "300000"
RATE_LIMIT_PER_MIN = "30"
ALLOWED_ORIGIN = "https://awasthisach.github.io"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "UserRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserRateLimiter"]
